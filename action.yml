name: 'Eolup'
description: 'Continuous EOL upgrade: moves projects off end-of-life frameworks and opens a PR only when your own tests pass.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  command:
    description: "Which Eolup command to run: 'scan' or 'remediate'."
    required: true
    default: 'scan'
  path:
    description: >
      Path to the project to scan/remediate. Defaults to the calling
      workflow's own checkout root ($GITHUB_WORKSPACE) if not set.
    required: false
    default: ''
  fail-on:
    description: >
      Which `remediate` verdicts should fail this step (exit code 2): 'none'
      (default — Eolup reports, you decide), 'blocked', or 'needs-review'
      (anything short of HighConfidence). Ignored by `scan`.
    required: false
    default: 'none'
  chain:
    description: >
      'true' to keep upgrading hop by hop (net6.0 -> net8.0 -> net10.0) while each
      hop is HighConfidence, stopping at the first that isn't; the PR then covers
      every high-confidence hop, one commit each. Default 'false': one hop per run.
      Ignored by `scan`.
    required: false
    default: 'false'
  bump-packages:
    description: >
      'true' to retry with the packages that version with the framework (ASP.NET Core,
      EF Core, Microsoft.Extensions.*) moved to the target major when the framework bump
      alone breaks the build or tests. The bump is its own commit and is kept only if the
      retry passes. Default 'false': nothing but the target framework changes.
      Ignored by `scan`.
    required: false
    default: 'false'
  build-timeout:
    description: >
      Minutes a restore or build may run before Eolup stops it. A build that is stopped
      can't be verified. Default: `buildTimeoutMinutes` from .eolup.yml, else 30.
      Ignored by `scan`.
    required: false
    default: ''
  test-timeout:
    description: >
      Minutes the test run may take before Eolup stops it; the verdict is then Blocked.
      Default: `testTimeoutMinutes` from .eolup.yml, else 60. Ignored by `scan`.
    required: false
    default: ''
  version:
    description: >
      Which release's pre-built `eolup` binary to use, e.g. 'v0.3.0' or
      'latest'. Defaults to the release tag this Action is pinned to
      (`uses: winter-is-compiling/eolup@v0.3.0`). Pinned to a branch or a commit
      instead, or if the download fails, the CLI is built from source.
    required: false
    default: ''

outputs:
  cli-source:
    description: "'release' if a pre-built binary was used, 'source' if the CLI was built from source."
    value: ${{ steps.cli.outputs.source }}

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Needed either way: Eolup drives the real `dotnet build`/`dotnet test`
        # of the project it upgrades.
        dotnet-version: '10.0.x'

    # A pre-built binary saves every run from compiling Eolup itself.
    # Anything short of a verified download falls back to building from source,
    # so an unusual runner never breaks the step — it's only slower.
    - name: Get the eolup CLI
      id: cli
      shell: bash
      env:
        EOLUP_VERSION: ${{ inputs.version }}
        EOLUP_ACTION_REF: ${{ github.action_ref }}
        EOLUP_REPO: ${{ github.action_repository || github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        fallback() {
          echo "::notice::Building Eolup from source ($1)."
          echo "source=source" >> "$GITHUB_OUTPUT"
          echo "path=" >> "$GITHUB_OUTPUT"
          exit 0
        }

        version="$EOLUP_VERSION"
        if [ -z "$version" ] && [[ "$EOLUP_ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          version="$EOLUP_ACTION_REF"
        fi
        [ -n "$version" ] || fallback "not pinned to a release"

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)     rid=linux-x64 ;;
          Windows/X64)   rid=win-x64 ;;
          macOS/ARM64)   rid=osx-arm64 ;;
          macOS/X64)     rid=osx-x64 ;;
          *)             fallback "no pre-built binary for $RUNNER_OS/$RUNNER_ARCH" ;;
        esac

        dir="$RUNNER_TEMP/eolup-cli"
        rm -rf "$dir" && mkdir -p "$dir"
        tag_args=("$version"); [ "$version" = "latest" ] && tag_args=()
        gh release download "${tag_args[@]}" --repo "$EOLUP_REPO" --dir "$dir" \
          --pattern "eolup-$rid.*" --pattern SHA256SUMS \
          || fallback "couldn't download release $version of $EOLUP_REPO"

        if command -v sha256sum > /dev/null; then sum=(sha256sum -c -); else sum=(shasum -a 256 -c -); fi
        (cd "$dir" && grep " eolup-$rid\." SHA256SUMS | "${sum[@]}") || fallback "checksum mismatch"

        if [ "$rid" = "win-x64" ]; then
          pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$dir/eolup-$rid.zip")' -DestinationPath '$(cygpath -w "$dir")' -Force" \
            || fallback "couldn't extract the archive"
          exe="$dir/eolup.exe"
        else
          tar -xzf "$dir/eolup-$rid.tar.gz" -C "$dir" || fallback "couldn't extract the archive"
          exe="$dir/eolup"
        fi

        "$exe" --version || fallback "the downloaded binary didn't run"
        echo "source=release" >> "$GITHUB_OUTPUT"
        echo "path=$exe" >> "$GITHUB_OUTPUT"

    - name: Run eolup ${{ inputs.command }}
      shell: bash
      # Inputs go through env rather than being spliced into the script, so a
      # crafted input value can't inject shell.
      env:
        EOLUP_COMMAND: ${{ inputs.command }}
        EOLUP_PATH: ${{ inputs.path }}
        EOLUP_FAIL_ON: ${{ inputs.fail-on }}
        EOLUP_CHAIN: ${{ inputs.chain }}
        EOLUP_BUMP_PACKAGES: ${{ inputs.bump-packages }}
        EOLUP_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        EOLUP_TEST_TIMEOUT: ${{ inputs.test-timeout }}
        EOLUP_CLI: ${{ steps.cli.outputs.path }}
      run: |
        TARGET_PATH="$EOLUP_PATH"
        if [ -z "$TARGET_PATH" ]; then
          TARGET_PATH="$GITHUB_WORKSPACE"
        fi
        EXTRA_ARGS=()
        if [ "$EOLUP_COMMAND" = "remediate" ]; then
          EXTRA_ARGS+=(--fail-on "$EOLUP_FAIL_ON")
          if [ "$EOLUP_CHAIN" = "true" ]; then
            EXTRA_ARGS+=(--chain)
          fi
          if [ "$EOLUP_BUMP_PACKAGES" = "true" ]; then
            EXTRA_ARGS+=(--bump-packages)
          fi
          # Passed as separate arguments (never spliced into a command line); the CLI rejects a non-number.
          if [ -n "$EOLUP_BUILD_TIMEOUT" ]; then
            EXTRA_ARGS+=(--build-timeout "$EOLUP_BUILD_TIMEOUT")
          fi
          if [ -n "$EOLUP_TEST_TIMEOUT" ]; then
            EXTRA_ARGS+=(--test-timeout "$EOLUP_TEST_TIMEOUT")
          fi
        fi
        # github.action_path resolves to this repo checked out at whatever ref
        # the caller pinned in `uses: winter-is-compiling/eolup@<ref>` — no
        # separate checkout of Eolup's own source needed.
        if [ -n "$EOLUP_CLI" ]; then
          "$EOLUP_CLI" "$EOLUP_COMMAND" "$TARGET_PATH" "${EXTRA_ARGS[@]}"
        else
          dotnet run --project "${{ github.action_path }}/src/Eolup.Cli" -- "$EOLUP_COMMAND" "$TARGET_PATH" "${EXTRA_ARGS[@]}"
        fi
