name: Live API smoke test

# Checks that the real endoflife.date API still returns what EndOfLifeDateClient
# expects. Kept out of ci.yml on purpose: it depends on a third-party service, and
# a network blip must not fail a merge gate. Runs weekly, and on demand from the
# Actions tab; a failure here means "go look at the API", not "this change is bad".

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run the live test
        run: dotnet test tests/Eolup.Fixtures.Tests --configuration Release --filter "Category=Live"
